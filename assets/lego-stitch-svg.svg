<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="stitchBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ba3e3"/>
      <stop offset="100%" stop-color="#1976d2"/>
    </linearGradient>
    <linearGradient id="stitchDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="stitchPinkEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff80ab"/>
      <stop offset="100%" stop-color="#f06292"/>
    </linearGradient>
    <linearGradient id="legoPinkHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Big Ear -->
  <g transform="rotate(-25 120 160)">
    <path d="M 60 180 C 10 110, 40 40, 130 90 C 130 140, 100 180, 60 180 Z" fill="url(#stitchDarkBlue)"/>
    <path d="M 70 170 C 30 115, 60 65, 120 100 C 115 135, 95 165, 70 170 Z" fill="url(#stitchPinkEar)"/>
    <!-- Cute ear notch (Lilo & Stitch feature) -->
    <path d="M 45 105 L 60 115 L 50 128 Z" fill="#fff0f5"/>
  </g>

  <!-- Right Big Ear -->
  <g transform="rotate(25 280 160)">
    <path d="M 340 180 C 390 110, 360 40, 270 90 C 270 140, 300 180, 340 180 Z" fill="url(#stitchDarkBlue)"/>
    <path d="M 330 170 C 370 115, 340 65, 280 100 C 285 135, 305 165, 330 170 Z" fill="url(#stitchPinkEar)"/>
  </g>

  <!-- Lego Head Shape (Rounded Lego Block with Cylindrical Head) -->
  <g filter="url(#softShadow)">
    <!-- Lego top head stud -->
    <rect x="180" y="112" width="40" height="14" rx="4" fill="#3b82f6"/>
    <ellipse cx="200" cy="112" rx="20" ry="5" fill="#60a5fa"/>

    <!-- Head block -->
    <rect x="130" y="122" width="140" height="115" rx="35" fill="url(#stitchBlue)"/>
    
    <!-- Lighter blue tummy/eye patch areas -->
    <ellipse cx="160" cy="175" rx="22" ry="26" fill="#90caf9" opacity="0.45"/>
    <ellipse cx="240" cy="175" rx="22" ry="26" fill="#90caf9" opacity="0.45"/>

    <!-- Big cute Lego-style glossy eyes -->
    <ellipse cx="165" cy="176" rx="14" ry="18" fill="#1e293b"/>
    <ellipse cx="235" cy="176" rx="14" ry="18" fill="#1e293b"/>
    <!-- Eye highlights -->
    <circle cx="160" cy="170" r="5" fill="#ffffff"/>
    <circle cx="168" cy="183" r="2" fill="#ffffff"/>
    <circle cx="230" cy="170" r="5" fill="#ffffff"/>
    <circle cx="238" cy="183" r="2" fill="#ffffff"/>

    <!-- Cute dark blue nose -->
    <ellipse cx="200" cy="192" rx="12" ry="8" fill="#0d47a1"/>
    <ellipse cx="198" cy="190" rx="4" ry="2" fill="#64b5f6"/>

    <!-- Happy cute smile -->
    <path d="M 185 208 Q 200 220 215 208" stroke="#0d47a1" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    
    <!-- Rosy cheeks -->
    <ellipse cx="145" cy="198" rx="10" ry="6" fill="#ff4081" opacity="0.4"/>
    <ellipse cx="255" cy="198" rx="10" ry="6" fill="#ff4081" opacity="0.4"/>
  </g>

  <!-- Lego Torso / Body -->
  <g filter="url(#softShadow)">
    <path d="M 148 234 L 252 234 L 262 315 L 138 315 Z" fill="url(#stitchBlue)"/>
    <!-- Light belly patch -->
    <path d="M 172 234 L 228 234 L 222 300 L 178 300 Z" fill="#90caf9" opacity="0.5"/>
  </g>

  <!-- Lego Arms holding Glowing Pink Heart -->
  <!-- Left Lego curved hand -->
  <g>
    <path d="M 148 245 C 120 260, 130 295, 160 300" stroke="#1976d2" stroke-width="18" stroke-linecap="round" fill="none"/>
    <circle cx="160" cy="300" r="10" fill="#38bdf8"/>
  </g>
  <!-- Right Lego curved hand -->
  <g>
    <path d="M 252 245 C 280 260, 270 295, 240 300" stroke="#1976d2" stroke-width="18" stroke-linecap="round" fill="none"/>
    <circle cx="240" cy="300" r="10" fill="#38bdf8"/>
  </g>

  <!-- Glowing Pink Lego Heart Brick in Center -->
  <g filter="url(#glow)">
    <path d="M 200 320 C 185 305, 155 280, 155 260 C 155 242, 172 235, 185 245 C 193 252, 200 260, 200 260 C 200 260, 207 252, 215 245 C 228 235, 245 242, 245 260 C 245 280, 215 305, 200 320 Z" fill="url(#legoPinkHeart)"/>
    <!-- Lego studs on the heart -->
    <ellipse cx="178" cy="254" rx="7" ry="4" fill="#ff80ab"/>
    <ellipse cx="222" cy="254" rx="7" ry="4" fill="#ff80ab"/>
    <ellipse cx="200" cy="275" rx="8" ry="4.5" fill="#ff80ab"/>
    <!-- Heart sparkles -->
    <circle cx="170" cy="245" r="2.5" fill="#ffffff"/>
    <circle cx="230" cy="250" r="3" fill="#ffffff"/>
  </g>

  <!-- Lego Legs -->
  <rect x="145" y="315" width="48" height="42" rx="6" fill="#1565c0"/>
  <rect x="207" y="315" width="48" height="42" rx="6" fill="#1565c0"/>
  <!-- Lego feet studs -->
  <rect x="140" y="352" width="56" height="14" rx="4" fill="#0d47a1"/>
  <rect x="204" y="352" width="56" height="14" rx="4" fill="#0d47a1"/>
</svg>
